
<!-- To insert student data -->
<!DOCTYPE html>
<html>

<head>
    <title>Insert Student</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>STUDENT MANAGEMENT SYSTEM</h1>
        <p>Student Records and Administration Portal</p>
    </header>

    <nav>
        <a href="index.html">Home</a> |
        <a href="list.html">List Students</a> |
        <a href="listOne.html">List Required Student</a> |
        <a href="insert.html">Insert Student</a> |
        <a href="update.html">Update Student</a> |
        <a href="delete.html">Delete Student</a>
    </nav>

    <hr>

    <form id="insertForm">

        <h2>INSERT STUDENT</h2>

        <p>Enter the details of the student.</p>

        <label for="sno">Student Number</label>
        <input type="number" id="sno"
               placeholder="Enter student number"
               min="1" required>

        <label for="name">Student Name</label>
        <input type="text" id="name"
               placeholder="Enter student name"
               required>

        <label for="total">Total Marks</label>
        <input type="number" id="total"
               placeholder="Enter total marks"
               min="0" required>

        <br><br>

        <button type="submit">Save Student</button>

        <button type="button"
                onclick="location.href='index.html'">
            Home Page
        </button>

    </form>

    <script>
        document.getElementById("insertForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let sno = document.getElementById("sno").value;
            let name = document.getElementById("name").value;
            let total = document.getElementById("total").value;

            fetch("/students", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    sno: sno,
                    name: name,
                    total: total
                })
            })
            .then(response => {
                return response.text().then(message => {
                    if (!response.ok) {
                        throw new Error(message);
                    }
                    return message;
                });
            })
            .then(message => {
                alert(message);
                location.href = "index.html";
            })
            .catch(error => {
                alert(error.message);
            });

        });
    </script>

</body>
</html>
