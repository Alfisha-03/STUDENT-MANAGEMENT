
<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>STUDENT MANAGEMENT SYSTEM</h1>
    <p>Student Records and Administration Portal</p>
</header>


    <nav>
        <a href="index.html">Home</a> |
        <a href="list.html">List Students</a> |
        <a href="listOne.html">List Required Student</a> |
        <a href="insert.html">Insert Student</a> |
        <a href="update.html">Update Student</a> |
        <a href="delete.html">Delete Student</a>
    </nav>

    <hr>

   
<main class="delete-page">

    <div class="delete-image">
        
<img
    src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1000&q=85"
    alt="Computer screen representing student database management"
>

    </div>

    <form id="deleteForm" class="delete-content">
        <h2>Delete Student</h2>

        <p>
            Enter the student number to remove a record
            from the student database.
        </p>

        <label for="sno">Student Number:</label>
        <input
            type="number"
            id="sno"
            placeholder="Enter student number"
            min="1"
            required
        >

        <button type="submit" class="delete-btn">
            Delete Student
        </button>

        <button
            type="button"
            onclick="location.href='index.html'"
        >
            Home Page
        </button>
    </form>

</main>

    <script>
        document.getElementById("deleteForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();

            let sno = document.getElementById("sno").value;

            if (!sno || Number(sno) <= 0) {
                alert("Please enter a valid student number.");
                return;
            }

            if (!confirm("Are you sure you want to delete this student?")) {
                return;
            }

            fetch("/students/" + sno, {
                method: "DELETE"
            })
            .then(response => {
                return response.text().then(message => {
                    if (!response.ok) {
                        throw new Error(message);
                    }
                    return message;
                });
            })
            .then(message => {
                alert(message);
                location.href = "index.html";
            })
            .catch(error => {
                alert(error.message);
            });
        });
    </script>

</body>
</html>
